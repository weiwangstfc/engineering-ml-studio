# Publish Engineering ML Studio to GitHub Pages.
#
# The application is a static site with no build step: the repository root IS the
# site. This workflow therefore uploads the checked-out tree as-is and deploys it.
# It runs no bundler, contacts no external/cloud/AI service, and uses no secrets.
#
# Before the first run, enable Pages for the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: deploy pages

on:
  push:
    branches:
      - main
  # Allow a manual deploy from the Actions tab.
  workflow_dispatch:

# Least privilege: read the tree, write the Pages artifact, mint the deploy token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The whole repository root is the site. Development-only directories
      # (node_modules, test-results) are gitignored and so are never checked out.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
